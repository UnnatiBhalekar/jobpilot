spring.application.name=jobpilot

# Database connection — points at the Docker Postgres container from earlier
spring.datasource.url=jdbc:postgresql://localhost:5432/jobpilot
spring.datasource.username=postgres
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: validate that our JPA entities match the existing schema,
# rather than letting Hibernate auto-generate or alter tables.
# We already hand-wrote and tested schema.sql — Hibernate should never
# be allowed to silently change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true